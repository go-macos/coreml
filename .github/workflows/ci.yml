name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A workflow that fails to PARSE reports nothing at all -- no red cross, no
  # run, just silence that reads exactly like success. actionlint is the only
  # thing that catches it, so it is the first lane here.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The real macOS lane. What runs here without a model is every refusal path
  # and the live Objective-C runtime: if a class or a selector this package
  # names has moved, the tests that construct a configuration and ask a
  # missing model to open will say so on whatever macOS the runner is.
  darwin:
    name: darwin (live runtime shape, CGO=0)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: The package must vet clean
        run: CGO_ENABLED=0 go vet ./...
      - name: Test
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - name: Race (CGO=1)
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      # The gate is on the PORTABLE files: expanding a half float and reading a
      # padded plane is arithmetic, and it is the part most likely to be
      # quietly wrong -- a half float read as bytes looks plausible and is
      # nonsense. The binding is exercised by the darwin lane, and the live
      # model test is skipped unless COREML_TEST_MODEL names a compiled model,
      # which a build machine has no reason to carry.
      - name: 100% coverage gate on the portable layer
        shell: bash
        run: |
          go tool cover -func=cover.out | grep -E '/plane.go:|/coreml.go:' > portable.txt
          cat portable.txt
          if grep -v '100.0%' portable.txt; then
            echo "::error::the portable layer is below 100% (lines above)"; exit 1
          fi
          echo "portable layer: 100%"
      - name: Coverage summary (whole package, bindings included)
        run: go tool cover -func=cover.out | tail -1

  # Every non-darwin platform must compile and answer ErrUnsupported rather
  # than failing to build: a consumer cross-compiles this without thinking
  # about it.
  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # All six of Go's 64-bit architectures, then the other platforms.
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  linux:
    name: linux (stub tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: CGO_ENABLED=0 go test -count=1 ./...
